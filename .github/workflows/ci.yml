name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  check-build-test:
    runs-on: ubuntu-latest
    name: Check / Build / Test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update dependencies
        run: |
          moon version --all
          moon update

      # Actions 的完整日志要仓库权限才能下载，失败时把编译器输出的头几百字节
      # 打成 annotation，提交页面上直接可见，定位问题不用登录。
      - name: Check (type / syntax, warnings are errors)
        run: |
          set -o pipefail
          if moon check --deny-warn 2>&1 | tee /tmp/check.log; then
            exit 0
          fi
          head -c 900 /tmp/check.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r//g' > /tmp/msg.txt
          printf '::error::%s\n' "$(cat /tmp/msg.txt)"
          exit 1

      - name: Test
        run: moon test

      - name: Corpus self-check
        run: moon run cmd/verify

      - name: Build CLI
        run: moon build --target native cmd/main

      # 标准符合性说明里贴的每段命令输出都要与实现逐字一致。
      # 这份材料是给审核方照着重跑的，少一行或多一个空格就算不实。
      - name: Docs output matches binary
        run: python3 tools/check_doc_outputs.py
